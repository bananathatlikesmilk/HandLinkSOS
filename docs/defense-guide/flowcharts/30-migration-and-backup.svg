<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="934" viewBox="0 0 1050 934"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#47695d"/></marker></defs><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="525" y="35">Migration and backup</tspan></text><rect x="45" y="70" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="121">Operator targets the intended database</tspan></text><path d="M355,156 L355,183" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="192" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="243">Open database with foreign keys enabled</tspan></text><path d="M355,278 L355,305" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,310 L665,357 L355,404 L45,357 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="365">Existing database present?</tspan></text><path d="M665,357 L748,357" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="345" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="314" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="339">Create initial schema</tspan><tspan x="890" y="365">without existing-data</tspan><tspan x="890" y="391">backup</tspan></text><path d="M355,404 L355,427" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="424" font-family="Arial" font-size="18">Yes</text><rect x="45" y="436" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="487">Create private pre-migration SQLite backup</tspan></text><path d="M355,522 L355,549" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="558" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="609">Apply committed migrations</tspan></text><path d="M355,644 L355,671" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,676 L665,723 L355,770 L45,723 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="718">Foreign-key verification</tspan><tspan x="355" y="744">passes?</tspan></text><path d="M665,723 L748,723" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="711" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="680" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="705">Stop startup;</tspan><tspan x="890" y="731">investigate or</tspan><tspan x="890" y="757">restore safely</tspan></text><path d="M355,770 L355,793" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="790" font-family="Arial" font-size="18">Yes</text><rect x="45" y="802" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="840">Continue to one-time seed and server</tspan><tspan x="355" y="866">startup</tspan></text></svg>