<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="934" viewBox="0 0 1050 934"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#47695d"/></marker></defs><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="525" y="35">HandLink system overview</tspan></text><rect x="45" y="70" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="121">User or staff opens browser / Android app</tspan></text><path d="M355,156 L355,183" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="192" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="243">Svelte interface sends HTTPS request</tspan></text><path d="M355,278 L355,305" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="314" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="365">SvelteKit hook identifies current session</tspan></text><path d="M355,400 L355,427" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,432 L665,479 L355,526 L45,479 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="474">Account, input, and</tspan><tspan x="355" y="500">permission allowed?</tspan></text><path d="M665,479 L748,479" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="467" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="436" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="474">Reject request; show</tspan><tspan x="890" y="500">error</tspan></text><path d="M355,526 L355,549" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="546" font-family="Arial" font-size="18">Yes</text><rect x="45" y="558" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="609">Feature service queries or writes SQLite</tspan></text><path d="M355,644 L355,671" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="680" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="731">Server returns protected response</tspan></text><path d="M355,766 L355,793" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="802" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="840">Interface updates; optional email / AI /</tspan><tspan x="355" y="866">push work follows</tspan></text></svg>