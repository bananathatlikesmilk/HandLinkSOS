<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="934" viewBox="0 0 1050 934"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#47695d"/></marker></defs><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="525" y="35">User account journey</tspan></text><rect x="45" y="70" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="121">Open welcome; register or sign in</tspan></text><path d="M355,156 L355,183" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,188 L665,235 L355,282 L45,235 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="243">Account verified and active?</tspan></text><path d="M665,235 L748,235" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="223" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="192" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="230">Verify email or</tspan><tspan x="890" y="256">recover access</tspan></text><path d="M355,282 L355,305" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="302" font-family="Arial" font-size="18">Yes</text><rect x="45" y="314" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="365">Load own profile and dashboard</tspan></text><path d="M355,400 L355,427" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="436" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="474">Choose SOS, profiles, sharing, or</tspan><tspan x="355" y="500">notifications</tspan></text><path d="M355,522 L355,549" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="558" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="609">Server checks the chosen action</tspan></text><path d="M355,644 L355,671" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="680" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="731">Review result in the app</tspan></text><path d="M355,766 L355,793" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="802" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="840">Logout ends session; deactivation blocks</tspan><tspan x="355" y="866">account</tspan></text></svg>