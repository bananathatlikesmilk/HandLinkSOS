<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="934" viewBox="0 0 1050 934"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#47695d"/></marker></defs><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="525" y="35">AI summary from notes to approval</tspan></text><rect x="45" y="70" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="121">Assigned Dispatcher saves incident notes</tspan></text><path d="M355,156 L355,183" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="192" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="230">Prepare redacted preview; review and</tspan><tspan x="355" y="256">confirm text</tspan></text><path d="M355,278 L355,305" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,310 L665,357 L355,404 L45,357 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="352">Consent, source, ownership,</tspan><tspan x="355" y="378">and limits valid?</tspan></text><path d="M665,357 L748,357" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="345" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="314" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="352">Reject; refresh or</tspan><tspan x="890" y="378">wait</tspan></text><path d="M355,404 L355,427" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="424" font-family="Arial" font-size="18">Yes</text><rect x="45" y="436" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="487">Reserve request; call local Ollama</tspan></text><path d="M355,522 L355,549" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><path d="M355,554 L665,601 L355,648 L45,601 Z" fill="#fff1cc" stroke="#a77b25" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="596">Output and current</tspan><tspan x="355" y="622">source/access still valid?</tspan></text><path d="M665,601 L748,601" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="589" text-anchor="middle" font-family="Arial" font-size="19">No</text><rect x="758" y="558" width="265" height="86" rx="12" fill="#fce8e6" stroke="#b86d65" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#653a35"><tspan x="890" y="596">Mark failure; keep</tspan><tspan x="890" y="622">saved summary</tspan></text><path d="M355,648 L355,671" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><text x="383" y="668" font-family="Arial" font-size="18">Yes</text><rect x="45" y="680" width="620" height="86" rx="12" fill="#eef4f1" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="731">Save extractive draft and version history</tspan></text><path d="M355,766 L355,793" stroke="#47695d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="802" width="620" height="86" rx="38" fill="#dbece4" stroke="#497963" stroke-width="2"/><text text-anchor="middle" font-family="Arial" font-size="23" fill="#16352e"><tspan x="355" y="840">Dispatcher checks content and explicitly</tspan><tspan x="355" y="866">approves</tspan></text></svg>