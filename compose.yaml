services:
  app:
    build: .
    image: handlink-sos:local
    init: true
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: /app/data/local.db
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - handlink-data:/app/data

volumes:
  handlink-data:
